name: Accessibility regression comment
on:
  workflow_run:
    workflows: [Accessibility regression scan]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: accessibility-comment-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false
jobs:
  comment:
    if: >-
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.name == 'Accessibility regression scan' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted default-branch comment tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Download report from the exact scan run
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: a11y-regression-report
          path: report-download
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate PR association and prepare safe comment
        id: prepare
        if: steps.artifact.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/pr-comment.mjs report-download/report.json comment.md
          node --input-type=module <<'NODE'
          const [owner, repo] = process.env.GH_REPOSITORY.split('/');
          const number = Number(process.env.PR_NUMBER);
          const headers = { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json', 'x-github-api-version': '2022-11-28' };
          const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/pulls/${number}`, { headers });
          if (!response.ok) throw new Error(`Cannot verify associated PR (${response.status}).`);
          const pr = await response.json();
          if (pr.base?.repo?.full_name !== process.env.GH_REPOSITORY || pr.head?.repo?.full_name !== process.env.RUN_HEAD_REPOSITORY || pr.head?.sha !== process.env.RUN_HEAD_SHA) {
            throw new Error('Workflow run PR association does not match current PR head.');
          }
          NODE
      - name: Create or update the single bot comment
        if: steps.prepare.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const issue_number = Number(context.payload.workflow_run.pull_requests[0].number);
            const { owner, repo } = context.repo;
            const marker = '<!-- a11y-regression-report -->';
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
